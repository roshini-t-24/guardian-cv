name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit and API tests
        run: python -m pytest test_pipeline.py -q
      - name: Determinism diagnostics
        if: ${{ !cancelled() }}
        run: python ci_diag.py > diagnostics.txt 2>&1
      - name: Metric validation (default threads)
        if: ${{ !cancelled() }}
        run: |
          echo "=== default threads ===" >> diagnostics.txt
          python validate_metrics.py >> diagnostics.txt 2>&1 || true
      - name: Metric validation (single thread)
        if: ${{ !cancelled() }}
        env:
          OPENCV_FOR_THREADS_NUM: "1"
        run: |
          echo "=== single thread ===" >> diagnostics.txt
          python validate_metrics.py >> diagnostics.txt 2>&1 || true
      - name: Kernel benchmark
        if: ${{ !cancelled() }}
        run: python benchmark_cool.py --iterations 30
      - name: Upload diagnostics and benchmark
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: |
            diagnostics.txt
            cool_benchmark_report.json