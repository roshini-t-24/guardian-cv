name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit and API tests
        run: python -m pytest test_pipeline.py -q
      - name: Decoded-frame hashes
        if: ${{ !cancelled() }}
        run: |
          python -c "import cv2,hashlib,glob
          for f in sorted(glob.glob('videos/clip[123]_[ps]*.avi'))[:3]:
              c=cv2.VideoCapture(f); h=hashlib.sha256()
              for _ in range(30):
                  ok,fr=c.read()
                  if not ok: break
                  h.update(fr.tobytes())
              print(f, h.hexdigest()[:12])" | tee decoded.txt
      - name: Metric validation
        run: |
          set -o pipefail
          python validate_metrics.py 2>&1 | tee validate.log
      - name: Kernel benchmark
        if: ${{ !cancelled() }}
        run: python benchmark_cool.py --iterations 30 2>&1 | tee bench.log
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: |
            decoded.txt
            validate.log
            bench.log
            cool_benchmark_report.json